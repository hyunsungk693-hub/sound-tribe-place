<!doctype html>

    <!-- maximum-scale·user-scalable은 두지 않는다. iOS는 접근성 이유로 어차피 무시하고,
         안드로이드는 그대로 따라 확대가 막혀 시력이 낮은 사용자가 본문을 키울 수 없다.
         이 옵션이 원래 막으려던 iOS 자동 확대는 index.css에서 모바일 폼 글자를 16px로
         못 박는 것으로 이미 해결했다. -->
