# Lovable Cloud 시절 프로젝트 id가 남아 있었다. 실제 연결 대상은 서울 리전의 instrut다.
# 어긋난 채로 두면 config.toml을 보고 URL을 만드는 코드가 조용히 엉뚱한 곳을 친다.
project_id = "syxodrmnukybnnlgttuw"


[functions.send-push]
verify_jwt = true

[auth]
enabled = true
site_url = "https://instrut.vercel.app"
additional_redirect_urls = ["http://localhost:8080", "https://instrut.vercel.app"]

[auth.email]
enable_signup = true
# 훅 검증 단계: 인증 메일 없이 즉시 가입 (기본 SMTP는 시간당 2건 제한이라 켜면 실가입이 막힘)
enable_confirmations = false
